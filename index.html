<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DialogMate</title>
    <link rel="stylesheet" href="css/chatBot.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Cal+Sans&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <nav>
            <ul class="nav_links">
                <li><a href="home.html"><button type="button" class="home">Home</button></a></li>
                <li><a href="details.html"><button type="button" class="details">Details</button></a></li>
                <li><a href="contact.html"><button type="button" class="cta-btn">Contact Us</button></a></li>
            </ul>
        </nav>
    </header>

    <main class="hero">
        <section class="intro-container">
            <h1>HOW MAY I<br>HELP YOU?</h1>
            <a href="home.html" class="cta-link">
                <button type="button">Get Started! <img src="image/right.png" alt=""></button>
            </a>
        </section>

        <section class="artwork" aria-hidden="true">
            <img class="planetary" src="image/planetary.png" alt="">
            <img class="satelite" src="image/satelite.png" alt="">

            <div class="speech">
                <img class="speech-bubble" src="image/speech-bubble.png" alt="">
                <p class="bot-intro">Hi there 👋<br>I'm Ruslan</p>
            </div>

            <div class="character">
                <img class="astronaut" src="image/laptop.png" alt="">
                <img class="moon" src="image/weather.png" alt="">
                <img class="flag" src="image/kyrgyzstan.png" alt="">
            </div>
        </section>
    </main>

    <script src="js/chatBot.js"></script>
</body>

</html>
